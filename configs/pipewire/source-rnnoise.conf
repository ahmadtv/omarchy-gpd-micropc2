# Noise-canceling virtual microphone for the GPD MicroPC 2's internal ALC269VC
# analog input. Wraps the built-in mic in RNNoise before anything else sees it.
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Microphone (Denoised)"
            media.name       = "Microphone (Denoised)"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = "librnnoise_ladspa"
                        label  = noise_suppressor_stereo
                        control = {
                            "VAD Threshold (%)" 50.0
                        }
                    }
                ]
            }
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.rnnoise"
                node.passive = true
                target.object = "alsa_input.pci-0000_00_1f.3.analog-stereo"
            }
            playback.props = {
                node.name  = "effect_output.rnnoise"
                media.class = Audio/Source
            }
        }
    }
]
